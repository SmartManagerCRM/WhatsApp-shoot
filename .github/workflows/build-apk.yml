name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      WSS_LICENSE_PUBLIC_KEY: ${{ vars.LICENSE_PUBLIC_KEY }}
      HAVE_KEYSTORE: ${{ secrets.WSS_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null; "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - name: Unit tests (licensing, tool, automation logic)
        run: ./gradlew --no-daemon :license-core:test :license-tool:test :app:testDebugUnitTest
      - name: Provide a throw-away licence key if none is configured (DEV BUILD ONLY)
        if: ${{ env.WSS_LICENSE_PUBLIC_KEY == '' }}
        run: |
          ./gradlew --no-daemon :license-tool:installDist
          WSS_KEY_PASSPHRASE=dev-only-throwaway-passphrase license-tool/build/install/license-tool/bin/license-tool keygen --out-dir "$RUNNER_TEMP/devkey"
          echo "WSS_LICENSE_PUBLIC_KEY=$(cat "$RUNNER_TEMP/devkey/license-public.b64")" >> "$GITHUB_ENV"
          echo "DEV_BUILD=true" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Build signed release APK
        if: ${{ env.HAVE_KEYSTORE == 'true' && env.DEV_BUILD != 'true' }}
        env:
          KEYSTORE_B64: ${{ secrets.WSS_KEYSTORE_B64 }}
          WSS_STORE_PASSWORD: ${{ secrets.WSS_STORE_PASSWORD }}
          WSS_KEY_PASSWORD: ${{ secrets.WSS_STORE_PASSWORD }}
          WSS_KEY_ALIAS: ${{ secrets.WSS_KEY_ALIAS }}
          WSS_SIGNER_SHA256: ${{ secrets.WSS_SIGNER_SHA256 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          export WSS_STORE_FILE="$RUNNER_TEMP/release.p12"
          ./gradlew --no-daemon :app:assembleRelease
          rm -f "$RUNNER_TEMP/release.p12"
      - name: Collect
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/ScreenshotAssistant-debug$([ "$DEV_BUILD" = true ] && echo -DEV-KEY-NOT-FOR-CUSTOMERS).apk
          ls app/build/outputs/apk/release/*.apk >/dev/null 2>&1 && cp app/build/outputs/apk/release/*.apk out/ScreenshotAssistant-release.apk || true
          cp dist/license-tool.jar out/ || true
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenshotAssistant-apk
          path: out/
